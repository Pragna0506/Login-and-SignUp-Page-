<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuthFlow — Login & Sign Up</title>
  <meta name="description" content="Modern animated login and sign up form with glassmorphism design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Animated background blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- Main Auth Container -->
  <div class="auth-wrapper">

    <!-- Card flip container -->
    <div class="card-container" id="cardContainer">

      <!-- ─── LOGIN SIDE ─── -->
      <div class="card card-front">
        <div class="card-inner">

          <div class="brand">
            <div class="brand-icon">✦</div>
            <span>AuthFlow</span>
          </div>

          <div class="card-header">
            <h1>Welcome back</h1>
            <p>Sign in to continue your journey</p>
          </div>

          <form class="auth-form" id="loginForm" novalidate>

            <div class="input-group" id="lg-email-group">
              <label for="lg-email">Email address</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                <input type="email" id="lg-email" placeholder="you@example.com" autocomplete="email" />
                <div class="input-line"></div>
              </div>
              <span class="field-error" id="lg-email-err"></span>
            </div>

            <div class="input-group" id="lg-pass-group">
              <label for="lg-pass">Password</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" id="lg-pass" placeholder="••••••••" autocomplete="current-password" />
                <button type="button" class="toggle-pass" aria-label="Toggle password" data-target="lg-pass">
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
                <div class="input-line"></div>
              </div>
              <span class="field-error" id="lg-pass-err"></span>
            </div>

            <div class="form-options">
              <label class="checkbox-wrap">
                <input type="checkbox" id="lg-remember" />
                <span class="checkmark"></span>
                Remember me
              </label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">
              <span class="btn-text">Sign In</span>
              <span class="btn-loader" aria-hidden="true"></span>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </button>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-btns">
              <button type="button" class="social-btn" id="google-login" aria-label="Sign in with Google">
                <svg viewBox="0 0 24 24" width="20" height="20">
                  <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                  <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                  <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                  <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Google
              </button>
              <button type="button" class="social-btn" id="github-login" aria-label="Sign in with GitHub">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12" />
                </svg>
                GitHub
              </button>
            </div>

          </form>

          <p class="switch-text">
            Don't have an account?
            <button class="switch-btn" id="goToSignup">Create one →</button>
          </p>

        </div>
      </div>

      <!-- ─── SIGN UP SIDE ─── -->
      <div class="card card-back">
        <div class="card-inner">

          <!-- Back to Login Button -->
          <button type="button" class="back-btn" id="goToLogin" aria-label="Back to Login">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
              <line x1="19" y1="12" x2="5" y2="12" />
              <polyline points="12 19 5 12 12 5" />
            </svg>
            Back to Login
          </button>

          <div class="brand">
            <div class="brand-icon">✦</div>
            <span>AuthFlow</span>
          </div>

          <div class="card-header">
            <p>Start your journey with us today</p>
          </div>

          <form class="auth-form" id="signupForm" novalidate>

            <div class="name-row">
              <div class="input-group" id="su-fname-group">
                <label for="su-fname">First name</label>
                <div class="input-wrap">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  <input type="text" id="su-fname" placeholder="John" autocomplete="given-name" />
                  <div class="input-line"></div>
                </div>
                <span class="field-error" id="su-fname-err"></span>
              </div>

              <div class="input-group" id="su-lname-group">
                <label for="su-lname">Last name</label>
                <div class="input-wrap">
                  <input type="text" id="su-lname" placeholder="Doe" autocomplete="family-name" />
                  <div class="input-line"></div>
                </div>
                <span class="field-error" id="su-lname-err"></span>
              </div>
            </div>

            <div class="input-group" id="su-email-group">
              <label for="su-email">Email address</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email" />
                <div class="input-line"></div>
              </div>
              <span class="field-error" id="su-email-err"></span>
            </div>

            <div class="input-group" id="su-pass-group">
              <label for="su-pass">Password</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input type="password" id="su-pass" placeholder="Min. 8 characters" autocomplete="new-password" />
                <button type="button" class="toggle-pass" aria-label="Toggle password" data-target="su-pass">
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
                <div class="input-line"></div>
              </div>
              <span class="field-error" id="su-pass-err"></span>
              <!-- Password strength bar -->
              <div class="strength-bar" id="strengthBar">
                <div class="strength-fill" id="strengthFill"></div>
              </div>
              <span class="strength-label" id="strengthLabel"></span>
            </div>

            <div class="input-group" id="su-confirm-group">
              <label for="su-confirm">Confirm password</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0 1 12 2.944a11.955 11.955 0 0 1-8.618 3.04A12.02 12.02 0 0 0 3 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <input type="password" id="su-confirm" placeholder="Repeat password" autocomplete="new-password" />
                <button type="button" class="toggle-pass" aria-label="Toggle password" data-target="su-confirm">
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
                <div class="input-line"></div>
              </div>
              <span class="field-error" id="su-confirm-err"></span>
            </div>

            <label class="checkbox-wrap terms-wrap">
              <input type="checkbox" id="su-terms" />
              <span class="checkmark"></span>
              I agree to the <a href="#" class="terms-link">Terms of Service</a> &amp; <a href="#"
                class="terms-link">Privacy Policy</a>
            </label>
            <span class="field-error" id="su-terms-err"></span>

            <button type="submit" class="btn-primary" id="signupBtn">
              <span class="btn-text">Create Account</span>
              <span class="btn-loader" aria-hidden="true"></span>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
              </svg>
            </button>

          </form>

        </div>
      </div>

    </div><!-- /card-container -->

    <!-- Success overlay -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-box">
        <div class="success-ring">
          <svg class="success-check" viewBox="0 0 52 52">
            <circle class="check-circle" cx="26" cy="26" r="25" fill="none" />
            <path class="check-mark" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
          </svg>
        </div>
        <h2 id="successTitle">Welcome back!</h2>
        <p id="successMsg">You've successfully signed in.</p>
        <button class="btn-primary success-close" id="successClose">Continue</button>
      </div>
    </div>

  </div><!-- /auth-wrapper -->

  <script src="script.js"></script>
</body>

</html>
